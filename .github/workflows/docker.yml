# ======================================================================
# Publish the self-hosting image (R06) to GitHub Container Registry.
#
#   ghcr.io/nurejev/enca:latest  ← every push to main   (production)
#   ghcr.io/nurejev/enca:beta    ← every push to beta   (beta channel)
#
# The repository guard matters: the beta SITE is a separate repo
# (nurejev/enca-beta) whose default branch is main — without the guard,
# deploying the beta site would publish beta code as :latest.
#
# ONE MANUAL STEP, once: after the first run, set the package's visibility
# to Public (github.com → Packages → enca → Package settings), or anonymous
# `docker pull` and the Deploy-to-Azure template cannot reach it.
# ======================================================================
name: docker image

on:
  push:
    branches: [main, beta]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'nurejev/enca'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # arm64 alongside amd64: Apple-silicon Macs are half the audience of
      # the local install script.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=$([ "${{ github.ref_name }}" = "main" ] && echo latest || echo beta)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nurejev/enca:${{ steps.tag.outputs.tag }}
