# ======================================================================
# nginx config for the ENCA self-hosting image (R06).
#
# Static files only. The Content-Security-Policy lives in index.html as a
# meta tag so it is identical on every host, including GitHub Pages where
# no server headers can be set — it is deliberately NOT duplicated here,
# because two copies of a CSP drift and the meta one is the one reviewed.
# ======================================================================
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers GitHub Pages cannot set but a server of your own can.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;

  # index.html must never be served stale: it carries the ?v= build number
  # of every asset, so a cached copy pins the whole app to an old build.
  location = /index.html {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # The optional deployment branding file (see SELF-HOSTING.md). Mounted in
  # by the operator; absent by default, and the app treats a 404 as "no
  # branding configured". Never cached — editing it must take effect on the
  # next reload, not after a cache expiry.
  location = /selfhost-branding.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Everything else is cache-busted by ?v= in index.html, so it can be
  # cached hard: a new build changes the query string, not the filename.
  location / {
    try_files $uri $uri/ =404;
  }
}
