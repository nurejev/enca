<style>
#enca-split{--e-bg:light-dark(#f2f6fc,#121d2b);--e-panel:light-dark(#fff,#1b293a);--e-ink:light-dark(#14263e,#e8eff9);--e-muted:light-dark(#586c89,#b2c3da);--e-line:light-dark(#d8e3f2,#36485e);--e-selected:light-dark(#edf8f2,#203e36);--e-blue:light-dark(#2469ea,#91b8ff);color:var(--e-ink);background:var(--e-bg);font:14px/1.5 system-ui,sans-serif;border:1px solid var(--e-line);border-radius:12px;overflow:hidden;color-scheme:light dark}
#enca-split *{box-sizing:border-box}#enca-split button,#enca-split input{font:inherit;color:inherit}#enca-split button{cursor:pointer;border:1px solid var(--e-line);border-radius:7px;background:var(--e-panel);padding:7px 11px}#enca-split button:hover{border-color:var(--e-blue)}#enca-split button:focus-visible{outline:2px solid var(--e-blue);outline-offset:2px}#enca-split .e-top{display:flex;gap:16px;align-items:center;padding:14px 20px;background:#143c2b;color:#fff}#enca-split .e-logo{background:#ffad20;color:#173a2a;border-radius:9px;padding:4px 10px;font-weight:700}#enca-split .e-brand{font-size:21px;font-weight:700}#enca-split .e-sub{font-size:12px;color:#d0e4d7}#enca-split .e-tenant{margin-left:auto;font-size:12px}#enca-split .e-frame{display:grid;grid-template-columns:72px minmax(0,1fr)}#enca-split .e-rail{border-right:1px solid var(--e-line);background:var(--e-panel);padding:16px 5px;display:flex;flex-direction:column;gap:14px}#enca-split .e-rail span{font-size:11px;text-align:center;padding:8px 2px;display:grid;gap:5px}#enca-split .e-rail .e-active{background:#ffad20;color:#173a2a;border-radius:8px}#enca-split .e-space{min-width:0}#enca-split .e-tabs{display:flex;gap:7px;padding:10px 16px;background:var(--e-panel);border-bottom:1px solid var(--e-line);flex-wrap:wrap}#enca-split [aria-pressed=true]{color:var(--e-blue);background:var(--e-selected)}#enca-split .e-main{padding:22px}#enca-split .e-title{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:25px;letter-spacing:-.8px}#enca-split .e-context{color:var(--e-muted);font-size:12px;margin:0 0 19px}#enca-split .e-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;background:var(--e-panel);border:1px solid var(--e-line);border-radius:10px;margin-bottom:12px}#enca-split .e-toolbar input{background:var(--e-panel);border:1px solid var(--e-line);border-radius:7px;padding:9px 12px;min-width:100px;flex:1}#enca-split .e-count{font-size:12px;color:var(--e-muted)}#enca-split .e-body{display:grid;grid-template-columns:minmax(0,54fr) minmax(0,46fr);gap:14px;align-items:start}#enca-split .e-list,#enca-split .e-detail{border:1px solid var(--e-line);background:var(--e-panel);border-radius:10px;min-width:0;overflow:hidden}#enca-split table{border-collapse:collapse;width:100%;table-layout:fixed}#enca-split th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--e-muted);background:var(--e-bg);padding:11px 12px}#enca-split td{padding:var(--e-row,15px) 12px;border-top:1px solid var(--e-line);vertical-align:top;font-size:12px}#enca-split .e-check{width:36px;padding-inline:10px}#enca-split .e-statecol{width:102px}#enca-split tr.e-focus{background:var(--e-selected)}#enca-split .e-rowbutton{display:block;text-align:left;padding:0;border:0;background:transparent;font-weight:600;overflow-wrap:anywhere;border-radius:0;width:100%}#enca-split .e-rowmeta{display:block;color:var(--e-muted);margin-top:5px;font-size:11px}#enca-split .e-status{font-size:11px;display:inline-block;padding:2px 7px;border-radius:20px;background:var(--e-bg);white-space:nowrap}#enca-split .e-paging{padding:12px;color:var(--e-muted);font-size:11px;border-top:1px solid var(--e-line)}#enca-split .e-detailhead{padding:18px 18px 12px}#enca-split .e-detailhead h2{font-size:17px;line-height:1.45;overflow-wrap:anywhere;margin:10px 0}#enca-split .e-detailactions{display:flex;justify-content:space-between;gap:8px;align-items:center}#enca-split .e-kicker{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--e-muted)}#enca-split .e-detailtabs{display:flex;gap:2px;flex-wrap:wrap;padding:0 12px;border-bottom:1px solid var(--e-line)}#enca-split .e-detailtabs button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 8px;font-size:11px;background:transparent}#enca-split .e-detailtabs button[aria-selected=true]{color:var(--e-blue);border-bottom-color:var(--e-blue)}#enca-split .e-content{padding:18px;font-size:12px;min-height:300px;overflow-wrap:anywhere}#enca-split .e-fields{display:grid;gap:20px}#enca-split .e-field span{display:block;color:var(--e-muted);font-size:11px;margin-bottom:5px}#enca-split .e-field p{margin:0}#enca-split .e-field b{font-weight:600}#enca-split .e-detailfoot{padding:13px 18px;border-top:1px solid var(--e-line);color:var(--e-muted);font-size:11px}#enca-split .e-bulk{padding:10px 12px;background:var(--e-selected);border-bottom:1px solid var(--e-line);font-size:12px}#enca-split .e-before{background:light-dark(#fff0ee,#472d2a);padding:12px;border-radius:6px;margin-bottom:10px}#enca-split .e-after{background:var(--e-selected);padding:12px;border-radius:6px}#enca-split pre{white-space:pre-wrap;font:11px/1.7 ui-monospace,monospace;margin:0}#enca-split .e-expanded .e-list{display:none}#enca-split .e-expanded{grid-template-columns:1fr}#enca-split .e-expanded .e-fields{grid-template-columns:1fr 1fr}#enca-split .e-empty{padding:28px}#enca-split .e-footer{padding:14px 22px;color:var(--e-muted);font-size:11px}#enca-split [hidden]{display:none!important}
@media(max-width:760px){#enca-split .e-body{grid-template-columns:1fr}#enca-split .e-main{padding:14px}#enca-split .e-frame{grid-template-columns:1fr}#enca-split .e-rail{display:none}#enca-split .e-sub{display:none}#enca-split .e-title{font-size:21px}#enca-split .e-expanded .e-fields{grid-template-columns:1fr}#enca-split .e-top{padding:12px;gap:8px}#enca-split .e-tenant{max-width:130px}#enca-split .e-toolbar button{font-size:12px}#enca-split .e-tabs button{font-size:12px}#enca-split .e-statecol{width:90px}}
</style>
<div id="enca-split" aria-label="ENCA list and detail design">
 <div class="e-top"><span class="e-logo">E</span><span class="e-brand">ENCA</span><span class="e-sub">Conditional Access / Workspaces</span><span class="e-tenant">Contoso · Demo concept</span></div>
 <div class="e-frame"><aside class="e-rail" aria-label="Workspace rail"><span>⌂<br>Home</span><span class="e-active">▤<br>Policies</span><span>◉<br>Sign-ins</span><span>♙<br>Who is…</span><span>▦<br>All tools</span></aside><div class="e-space">
 <nav class="e-tabs" aria-label="Mockup examples"><button data-tool="Policies">Policies</button><button data-tool="Sign-in log">Sign-in log</button><button data-tool="Changes">Changes</button></nav>
 <main class="e-main"><h1 class="e-title"></h1><p class="e-context"></p><div class="e-toolbar"><input type="search" aria-label="Search current list" placeholder="Search policies…"><button data-filter="All">All</button><button data-filter="On">On</button><button data-filter="Report-only">Report-only</button><button data-filter="Off">Off</button><span class="e-count"></span></div>
 <div class="e-body"><section class="e-list" aria-label="Results list"><div class="e-bulk" hidden></div><table><thead><tr><th class="e-check"><input type="checkbox" aria-label="Select all visible rows"></th><th class="e-colname">Policy</th><th class="e-statecol">State</th></tr></thead><tbody></tbody></table><div class="e-paging"></div></section><section class="e-detail" aria-label="Selected record details"><div class="e-detailhead"><div class="e-detailactions"><span class="e-kicker">Policy details</span><button class="e-expand">Open wide ↗</button></div><h2></h2><span class="e-status"></span></div><div class="e-detailtabs" role="tablist" aria-label="Detail sections"></div><div class="e-content" role="tabpanel" id="enca-split-panel"></div><div class="e-detailfoot"></div></section></div></main><div class="e-footer">Design preview · sample data · no tenant connection</div>
 </div></div>
</div>
<script>
(()=>{
 const root=document.getElementById('enca-split'),q=s=>root.querySelector(s),all=s=>[...root.querySelectorAll(s)];
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const names=['CA098-GRANT-GLOBAL-IdentityProtection-Devex-AnyPlatform-MFA-v1.0','CA102-GRANT-Internals-AnyApp-AnyPlatform-MFA-v1.0','CA102-GRANT-Internals-AnyApp-AnyPlatform-MFA-v1.1','CA103-BLOCK-Global-LegacyAuthentication-v1.0','CA104-GRANT-Internals-CompliantDevice-v1.0','CA105-BLOCK-Global-UnknownPlatforms-v1.0'];
 const data={Policies:names.map((name,i)=>({name,status:['On','On','Report-only','On','Report-only','Off'][i],meta:['All users · MFA','Internals · MFA','Internals · staged update','All users · block','Internals · compliant device','All users · block'][i],target:i===0?'All users':'g-CA-Persona-Internals',grant:i===3||i===5?'Block access':i===4?'Require compliant device':'Require multifactor authentication'})),
 'Sign-in log':[{name:'Alex Morgan → Microsoft 365',status:'Failure',meta:'10:42 · Windows · Amsterdam',code:'53003',policy:names[0]},{name:'Sam Patel → Azure portal',status:'Interrupted',meta:'10:36 · macOS · London',code:'50076',policy:names[1]},{name:'Robin de Vries → SharePoint',status:'Failure',meta:'10:31 · iOS · Utrecht',code:'53003',policy:names[4]},{name:'Alex Morgan → Exchange Online',status:'Failure',meta:'10:18 · Windows · Amsterdam',code:'53003',policy:names[3]}],
 Changes:[{name:names[2],status:'Update',meta:'Today 10:24 · Jordan Lee',field:'State',before:'Off',after:'Report-only'},{name:names[0],status:'Update',meta:'Today 09:58 · Casey Taylor',field:'Excluded groups',before:'BreakGlass',after:'BreakGlass; CA098-Exclusion'},{name:names[5],status:'Create',meta:'Yesterday 16:40 · Jordan Lee',field:'Policy',before:'Not present',after:'Created · Off'}]};
 let state={tool:'Policies',index:0,tab:'Settings',filter:'All',query:'',wide:false},selected=new Set(); const design={listWidth:54,compact:false};
 const tabs=()=>state.tool==='Policies'?['Settings','Assignments','Conditions','Controls','Definition']:state.tool==='Sign-in log'?['Event','Policies','Authentication','Device']:['Changed fields','Actor','Event'];
 const remember=()=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{mockup:'ENCA list and detail',tool:state.tool,tab:state.tab,wide:state.wide},privateContent:state}).catch(()=>{});};
 function content(r){
 const fields=entries=>'<div class="e-fields">'+entries.map(([k,v])=>'<div class="e-field"><span>'+esc(k)+'</span><p>'+esc(v)+'</p></div>').join('')+'</div>';
 if(state.tool==='Policies'){
 if(state.tab==='Definition')return '<pre>'+esc(JSON.stringify({displayName:r.name,state:r.status,conditions:{users:{include:r.target,exclude:'g-CA-BreakGlass'},applications:'All resources'},grantControls:r.grant},null,2))+'</pre>';
 const sets={Settings:[['Users',r.target],['Excluded','g-CA-BreakGlass · g-CA098-Exclusion'],['Target resources','All resources'],['Conditions','All platforms · browser and mobile/desktop clients'],['Grant controls',r.grant],['Session controls','Not configured']],Assignments:[['Include',r.target],['Exclude','g-CA-BreakGlass\ng-CA098-Exclusion'],['Resources','All resources']],Conditions:[['Platforms','Any platform'],['Client apps','Browser; mobile apps and desktop clients'],['Network','Any network or location'],['User risk / Sign-in risk','Not configured']],Controls:[['Grant',r.grant],['Control operator','Require all selected controls (AND)'],['Session','Not configured']]};return fields(sets[state.tab]||sets.Settings);
 }
 if(state.tool==='Sign-in log'){
 const sets={Event:[['User',r.name.split(' → ')[0]],['Application',r.name.split(' → ')[1]],['Result',r.status+' · '+r.code],['Time / Location',r.meta],['Source','Entra sign-in log · sample event']],Policies:[['Policy',r.policy],['Recorded result','Failure'],['Evidence','A recorded policy evaluation; this view does not infer outcomes for other sign-ins.']],Authentication:[['Recorded requirement','Multifactor authentication'],['Method detail','Not included in this sample event']],Device:[['Platform',r.meta.split(' · ')[1]],['Compliance / Join state','Not included in this sample event']]};return fields(sets[state.tab]||sets.Event);
 }
 if(state.tab==='Changed fields')return '<div class="e-field"><span>'+esc(r.field)+'</span><div class="e-before"><b>Before</b><p>'+esc(r.before)+'</p></div><div class="e-after"><b>After</b><p>'+esc(r.after)+'</p></div></div>';
 return state.tab==='Actor'?fields([['Initiated by',r.meta.split(' · ')[1]],['Actor type','User'],['Activity','Update Conditional Access policy']]):fields([['Resource',r.name],['Activity',r.status],['Time',r.meta.split(' · ')[0]],['Source','Directory audit log · sample event']]);
 }
 function render(){
 const rows=data[state.tool];state.index=Math.max(0,Math.min(state.index,rows.length-1));let current=rows[state.index];
 const visible=rows.map((r,i)=>({...r,i})).filter(r=>(state.filter==='All'||r.status===state.filter)&&(r.name+' '+r.meta).toLowerCase().includes(state.query.toLowerCase()));
 if(visible.length&&!visible.some(r=>r.i===state.index)){state.index=visible[0].i;current=rows[state.index];}q('.e-detail').hidden=!visible.length;
 q('.e-title').textContent=state.tool;q('.e-context').textContent=state.tool==='Policies'?'List view · Contoso · policy snapshot':state.tool==='Changes'?'Timeline · Contoso · last 7 days':'Enforced · events · Contoso · last 24 hours';
 all('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===state.tool));q('.e-rail .e-active').innerHTML='▤<br>'+esc(state.tool);
 q('input[type=search]').placeholder='Search '+(state.tool==='Policies'?'policies':state.tool==='Changes'?'resource or actor':'user or application')+'…';q('input[type=search]').value=state.query;
 all('[data-filter]').forEach(b=>{b.hidden=state.tool!=='Policies';b.setAttribute('aria-pressed',state.filter===b.dataset.filter);});q('.e-count').textContent=visible.length+' shown';
 q('.e-colname').textContent=state.tool==='Policies'?'Policy':state.tool==='Changes'?'Changed resource':'Sign-in';q('.e-statecol').textContent=state.tool==='Changes'?'Action':'State';
 q('tbody').innerHTML=visible.map(r=>'<tr class="'+(r.i===state.index?'e-focus':'')+'"><td class="e-check"><input type="checkbox" data-check="'+r.i+'" aria-label="Select '+esc(r.name)+'" '+(selected.has(r.i)?'checked':'')+'></td><td><button class="e-rowbutton" data-row="'+r.i+'" aria-pressed="'+(r.i===state.index)+'">'+esc(r.name)+'</button><span class="e-rowmeta">'+esc(r.meta)+'</span></td><td><span class="e-status">'+esc(r.status)+'</span></td></tr>').join('')||'<tr><td colspan="3" class="e-empty">No matching records</td></tr>';
 const check=q('thead input');check.checked=visible.length>0&&visible.every(r=>selected.has(r.i));check.indeterminate=visible.some(r=>selected.has(r.i))&&!check.checked;
 q('.e-bulk').hidden=!selected.size;q('.e-bulk').textContent=selected.size+' selected · selection is separate from the open detail';q('.e-paging').textContent=visible.length+' of '+rows.length+' sample records';
 q('.e-body').classList.toggle('e-expanded',state.wide);q('.e-body').style.gridTemplateColumns=state.wide?'':null;
 root.style.setProperty('--e-row',design.compact?'10px':'15px');if(!state.wide&&root.clientWidth>760)q('.e-body').style.gridTemplateColumns=`minmax(0,${design.listWidth}fr) minmax(0,${100-design.listWidth}fr)`;
 q('.e-expand').textContent=state.wide?'↙ Back to list':'Open wide ↗';q('.e-kicker').textContent=state.tool==='Policies'?'Policy details':state.tool==='Changes'?'Change details':'Sign-in details';q('.e-detailhead h2').textContent=current.name;q('.e-detailhead>.e-status').textContent=current.status;
 const ts=tabs();if(!ts.includes(state.tab))state.tab=ts[0];q('.e-detailtabs').innerHTML=ts.map((t,i)=>'<button id="enca-dtab-'+i+'" role="tab" aria-controls="enca-split-panel" aria-selected="'+(t===state.tab)+'" data-detail="'+t+'">'+t+'</button>').join('');q('.e-content').setAttribute('aria-labelledby','enca-dtab-'+ts.indexOf(state.tab));q('.e-content').innerHTML=content(current);q('.e-detailfoot').textContent=state.tool==='Policies'?'Full original policy name · no added ENCA number':'Selected record · read-only detail';
 }
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tool){state={tool:b.dataset.tool,index:0,tab:'',filter:'All',query:'',wide:false};selected.clear();}else if(b.dataset.row!==undefined){state.index=+b.dataset.row;}else if(b.dataset.detail){state.tab=b.dataset.detail;}else if(b.dataset.filter){state.filter=b.dataset.filter;}else if(b.classList.contains('e-expand')){state.wide=!state.wide;}render();remember();});
 q('input[type=search]').addEventListener('input',e=>{state.query=e.target.value;render();remember();});
 root.addEventListener('change',e=>{if(e.target.dataset.check!==undefined){const i=+e.target.dataset.check;e.target.checked?selected.add(i):selected.delete(i);}else if(e.target===q('thead input')){all('[data-check]').forEach(c=>e.target.checked?selected.add(+c.dataset.check):selected.delete(+c.dataset.check));}else return;render();});
 const restore=s=>{if(s&&data[s.tool]){state={...state,...s};render();}};restore(window.openai?.widgetState?.privateContent);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState?.privateContent));render();
 let lastWidth=root.clientWidth;new ResizeObserver(()=>{if(root.clientWidth!==lastWidth){lastWidth=root.clientWidth;render();}}).observe(root);
 if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addSlider(design,'listWidth',{label:'List width',min:45,max:65,unit:'%'});t.addToggle(design,'compact',{label:'Compact rows'});}
})();
</script>
